[project]
name = "stat386-streamlit"
version = "1.0.0"
description = "Useful dashboards and reproducible text exploration for STAT 386"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.49,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "plotly>=6,<7",
  "scikit-learn>=1.5,<2",
  "phate>=1.0.11,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["ipykernel>=6.29,<8"]
preparation = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1"]

[tool.uv]
package = false
